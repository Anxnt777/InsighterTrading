server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: insighter-trading-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
# Development profile: In-memory H2 database with PostgreSQL compatibility mode
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:insighter_dev_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
  connect-timeout-ms: 5000
  read-timeout-ms: 15000

---
# Production / Docker profile: Real PostgreSQL
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:insighter_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
  connect-timeout-ms: 5000
  read-timeout-ms: 15000
